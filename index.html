  ];

  const STUDY_DURATIONS = [
    [30,'30分'], [60,'1時間'], [90,'1時間30分'],
    [120,'2時間'], [150,'2時間30分'], [180,'3時間以上']
  ];

  function formatStudyDuration(mins){
    if(!mins) return '';
    const h = Math.floor(mins/60), m = mins%60;
    if(h===0) return m+'分';
    if(m===0) return h+'時間';
    return h+'時間'+m+'分';
  }

  function studyLogKey(d){ return 'studylog:'+fmtDateKey(d); }

  async function loadStudyLog(){
    try{
      const v = localStorage.getItem(studyLogKey(state.date));
      const res = v !== null ? {value:v} : null;
      state.studyLog = res && res.value ? JSON.parse(res.value) : {};
    }catch(e){
      state.studyLog = {};
    }
    renderStudyLogBar();
  }

  async function saveStudyLogData(data){
    state.studyLog = data;
    try{
      localStorage.setItem(studyLogKey(state.date), JSON.stringify(data));
    }catch(e){ /* 保存できなくても操作は継続 */ }
    renderStudyLogBar();
  }

  function studyLogTotal(log){
    return STUDY_SUBJECTS.reduce((sum,[key])=> sum + (parseInt(log[key],10) || 0), 0);
  }

  function renderStudyLogBar(){
    const log = state.studyLog || {};
    const total = studyLogTotal(log);
    const durText = formatStudyDuration(log.duration);
    let text;
    if(total > 0 && durText) text = '📝 今日の学習: <strong>'+total+'</strong>問・<strong>'+durText+'</strong>';
    else if(total > 0) text = '📝 今日の学習: <strong>'+total+'</strong>問';
    else if(durText) text = '📝 今日の学習時間: <strong>'+durText+'</strong>';
    else text = '📝 今日解いた問題数を記録';
    studyLogBarEl.innerHTML = text + ' <span class="chev">›</span>';
  }

  function openStudyLogSheet(){
    const log = state.studyLog || {};
    let selectedDuration = log.duration || null;
    const durChips = STUDY_DURATIONS.map(([mins,label])=>
      '<div class="dur-choice'+(mins===selectedDuration ? ' active' : '')+'" data-mins="'+mins+'">'+label+'</div>'
    ).join('');
    const rows = STUDY_SUBJECTS.map(([key,label])=>
      '<div class="sl-row"><label>'+label+'</label><input type="text" inputmode="numeric" class="sl-input" data-key="'+key+'" value="'+(log[key] || '')+'"></div>'
    ).join('');
    openSheet(
      '<div class="sheet-title">今日解いた問題数</div>' +
      '<p class="sl-section-label">勉強時間</p>' +
      '<div class="dur-choices">'+durChips+'</div>' +
      '<p class="sl-section-label" style="margin-top:18px;">科目別の問題数</p>' +
      '<div class="studylog-grid">'+rows+'</div>' +
      '<div class="sheet-actions" style="margin-top:18px;">' +
        '<button class="btn btn-ghost" id="sl-cancel">閉じる</button>' +
        '<button class="btn btn-primary" id="sl-save">保存</button>' +
      '</div>'
    );
    sheetContent.querySelectorAll('.dur-choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        const mins = parseInt(el.dataset.mins, 10);
        if(selectedDuration === mins){
          selectedDuration = null;
        } else {
          selectedDuration = mins;
        }
        sheetContent.querySelectorAll('.dur-choice').forEach(x=>x.classList.remove('active'));
        if(selectedDuration !== null) el.classList.add('active');
      });
    });
    sheetContent.querySelector('#sl-cancel').addEventListener('click', closeSheet);
    sheetContent.querySelector('#sl-save').addEventListener('click', ()=>{
      const data = {};
      sheetContent.querySelectorAll('.sl-input').forEach(inp=>{
        const v = parseInt(inp.value, 10);
        if(!isNaN(v) && v > 0) data[inp.dataset.key] = v;
      });
      if(selectedDuration) data.duration = selectedDuration;
      saveStudyLogData(data);
      closeSheet();
    });
  }
  studyLogBarEl.addEventListener('click', openStudyLogSheet);

  const EXAM_DATE = new Date(2026, 10, 8); // 行政書士試験: 2026年11月8日

  function renderExamCountdown(){
    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diffDays = Math.round((EXAM_DATE - todayMid) / 86400000);
    if(diffDays > 0){
      examCountdownEl.innerHTML = '行政書士試験まであと <span class="num">'+diffDays+'</span> 日';
      examCountdownEl.style.display = 'flex';
    } else if(diffDays === 0){
      examCountdownEl.innerHTML = '本日、行政書士試験です';
      examCountdownEl.style.display = 'flex';
    } else {
      examCountdownEl.style.display = 'none';
    }
  }

  function renderDateLabel(){
    const d = state.date;
    dateLabel.innerHTML = '<span class="year">'+d.getFullYear()+'年</span>'+(d.getMonth()+1)+'月'+d.getDate()+'日<span class="weekday">'+dow[d.getDay()]+'曜日</span>';
  }

  async function loadEvents(){
    try{
      const v = localStorage.getItem(storageKey(state.date));
      const res = v !== null ? {value:v} : null;
      state.events = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      state.events = [];
    }
    renderTimeline();
  }

  async function saveEvents(){
    try{
      localStorage.setItem(storageKey(state.date), JSON.stringify(state.events));
    }catch(e){ /* 保存できなくても操作は継続 */ }
  }

  function minutesToLabel(m){
    const h = Math.floor(m/60), mi = m%60;
    return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
  }

  function renderTimeline(){
    timeline.innerHTML = '';
    for(let h=0; h<24; h++){
      const row = document.createElement('div');
      row.className = 'hour-row';
      const label = document.createElement('div');
      label.className = 'hour-label';
      label.textContent = String(h).padStart(2,'0')+':00';
      row.appendChild(label);
      timeline.appendChild(row);
    }

    if(isToday(state.date)){
      const now = new Date();
      const mins = now.getHours()*60 + now.getMinutes();
      const line = document.createElement('div');
      line.className = 'now-line';
      line.style.top = (mins * PX_PER_MIN) + 'px';
      const nowLabel = document.createElement('div');
      nowLabel.className = 'now-label';
      nowLabel.textContent = minutesToLabel(mins);
      line.appendChild(nowLabel);
      timeline.appendChild(line);
    }

    if(state.events.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<strong>予定はまだありません</strong>マイクボタンを押して話しかけるか、＋で手入力してみましょう。';
      timeline.appendChild(empty);
    }

    state.events.slice().sort((a,b)=>a.start-b.start).forEach(ev=>{
      const card = document.createElement('div');
      card.className = 'event-card cat-'+ev.category;
      card.style.top = (ev.start * PX_PER_MIN) + 'px';
      card.style.height = Math.max(ev.duration * PX_PER_MIN, MIN_CARD_PX) + 'px';
      card.innerHTML = '<div class="event-title">'+escapeHtml(ev.title)+'</div>'+
        '<div class="event-time">'+minutesToLabel(ev.start)+' – '+minutesToLabel(ev.start+ev.duration)+'</div>';
      card.addEventListener('click', ()=> openEditSheet(ev.id));
      timeline.appendChild(card);
    });

    timeline.style.height = (24 * HOUR_PX) + 'px';
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function scrollToNow(){
    if(isToday(state.date)){
      const now = new Date();
      const mins = now.getHours()*60 + now.getMinutes();
      timelineWrap.scrollTop = Math.max(0, mins * PX_PER_MIN - 160);
    } else {
      timelineWrap.scrollTop = 8*HOUR_PX - 40;
    }
  }

  document.getElementById('prevDay').addEventListener('click', ()=>{
    state.date.setDate(state.date.getDate()-1);
    renderDateLabel(); loadEvents(); loadStudyLog(); scrollToNow();
  });
  document.getElementById('nextDay').addEventListener('click', ()=>{
    state.date.setDate(state.date.getDate()+1);
    renderDateLabel(); loadEvents(); loadStudyLog(); scrollToNow();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    state.date = new Date();
    renderDateLabel(); loadStudyLog();
    if(state.viewMode === 'month'){
      state.monthCursor = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
      renderMonthGrid();
    } else {
      loadEvents(); scrollToNow();
    }
  });

  /* ---------- Month view ---------- */
  function monthPrefix(year, month){
    return 'schedule:'+year+'-'+String(month+1).padStart(2,'0');
  }

  async function daysWithEventsInMonth(year, month){
    const daySet = new Set();
    try{
      const prefix = monthPrefix(year, month);
      const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix));
      keys.forEach(k=>{
        const m = k.match(/schedule:\d{4}-\d{2}-(\d{2})$/);
        if(m) daySet.add(parseInt(m[1], 10));
      });
    }catch(e){ /* 一覧取得に失敗しても表示は継続 */ }
    return daySet;
  }

  async function renderMonthGrid(){
    const year = state.monthCursor.getFullYear();
    const month = state.monthCursor.getMonth();
    monthLabelEl.textContent = year+'年'+(month+1)+'月';

    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const eventDays = await daysWithEventsInMonth(year, month);

    const todayKey = fmtDateKey(new Date());
    const selectedKey = fmtDateKey(state.date);

    let html = '';
    for(let i=0; i<firstDow; i++){
      html += '<div class="month-cell blank"></div>';
    }
    for(let day=1; day<=daysInMonth; day++){
      const cellDate = new Date(year, month, day);
      const key = fmtDateKey(cellDate);
      const classes = ['month-cell'];
      if(key === todayKey) classes.push('today');
      if(key === selectedKey) classes.push('selected');
      html += '<div class="'+classes.join(' ')+'" data-day="'+day+'">'+day+
        (eventDays.has(day) ? '<span class="dot"></span>' : '') + '</div>';
    }
    monthGridEl.innerHTML = html;

    monthGridEl.querySelectorAll('.month-cell:not(.blank)').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        const day = parseInt(cell.dataset.day, 10);
        state.date = new Date(year, month, day);
        switchToDayView();
      });
    });
  }

  function switchToDayView(){
    state.viewMode = 'day';
    monthViewEl.style.display = 'none';
    timelineWrap.style.display = '';
    controlsEl.style.display = 'flex';
    calToggleBtn.classList.remove('active');
    dateNavEl.style.display = '';
    renderDateLabel(); loadEvents(); loadStudyLog(); scrollToNow();
  }

  function switchToMonthView(){
    state.viewMode = 'month';
    state.monthCursor = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
    timelineWrap.style.display = 'none';
    controlsEl.style.display = 'none';
    monthViewEl.style.display = 'block';
    calToggleBtn.classList.add('active');
    dateNavEl.style.display = 'none';
    renderMonthGrid();
  }

  calToggleBtn.addEventListener('click', ()=>{
    if(state.viewMode === 'month'){
      switchToDayView();
    } else {
      switchToMonthView();
    }
  });

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    state.monthCursor.setMonth(state.monthCursor.getMonth()-1);
    renderMonthGrid();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    state.monthCursor.setMonth(state.monthCursor.getMonth()+1);
    renderMonthGrid();
  });

  /* ---------- Sheet (bottom form) ---------- */
  function openSheet(html){
    sheetContent.innerHTML = html;
    overlay.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheet(){
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    state.editingId = null;
  }
  overlay.addEventListener('click', closeSheet);

  function categoryChoicesHtml(selected){
    const cats = [['work','仕事'],['study','勉強'],['private','プライベート']];
    return '<div class="cat-choices">' + cats.map(c=>
      '<div class="cat-choice'+(c[0]===selected?' active':'')+'" data-cat="'+c[0]+'">'+c[1]+'</div>'
    ).join('') + '</div>';
  }

  const EVENT_DURATIONS = [15, 30, 45, 60, 90, 120];

  function quickDurationChipsHtml(selected){
    const chips = EVENT_DURATIONS.map(m=>
      '<div class="dur-choice'+(m===selected ? ' active' : '')+'" data-mins="'+m+'">'+formatStudyDuration(m)+'</div>'
    ).join('');
    return '<div class="dur-choices" id="f-duration-choices">'+chips+'</div>';
  }

  function buildFormHtml({title, time, duration, category, heardText, mode}){
    const dur = duration || 30;
    const [sh, sm] = time.split(':').map(Number);
    const endLabel = minutesToLabel((sh*60 + sm + dur) % 1440);
    return (heardText ? '<div class="heard-text">🎙 「'+escapeHtml(heardText)+'」</div>' : '') +
      '<div class="sheet-title">'+(mode==='edit' ? '予定を編集' : '予定を追加')+'</div>' +
      '<div class="field"><label>タイトル</label><input type="text" id="f-title" value="'+escapeHtml(title||'')+'" placeholder="例: 打ち合わせ"></div>' +
      '<div class="field"><label>時刻</label><div class="time-range">' +
        '<input type="time" id="f-time" value="'+time+'">' +
        '<span class="time-sep">〜</span>' +
        '<input type="time" id="f-end-time" value="'+endLabel+'">' +
      '</div></div>' +
      '<div class="field"><label>長さの目安</label>'+quickDurationChipsHtml(dur)+'</div>' +
      '<div class="field"><label>カテゴリー</label>'+categoryChoicesHtml(category||'private')+'</div>' +
      '<div class="sheet-actions">' +
        (mode==='edit' ? '<button class="btn btn-danger" id="f-delete">削除</button>' : '<button class="btn btn-ghost" id="f-cancel">キャンセル</button>') +
        '<button class="btn btn-primary" id="f-save">'+(mode==='edit' ? '保存' : '追加')+'</button>' +
      '</div>';
  }

  function wireForm({mode, id}){
    let selectedCat = sheetContent.querySelector('.cat-choice.active')?.dataset.cat || 'private';
    sheetContent.querySelectorAll('.cat-choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        sheetContent.querySelectorAll('.cat-choice').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        selectedCat = el.dataset.cat;
      });
    });

    const startInput = sheetContent.querySelector('#f-time');
    const endInput = sheetContent.querySelector('#f-end-time');
    const durChips = sheetContent.querySelectorAll('#f-duration-choices .dur-choice');

    durChips.forEach(el=>{
      el.addEventListener('click', ()=>{
        durChips.forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        const mins = parseInt(el.dataset.mins, 10);
        const [hh,mm] = startInput.value.split(':').map(Number);
        endInput.value = minutesToLabel((hh*60+mm+mins) % 1440);
      });
    });
    startInput.addEventListener('input', ()=>{
      const activeChip = sheetContent.querySelector('#f-duration-choices .dur-choice.active');
      if(activeChip){
        const mins = parseInt(activeChip.dataset.mins, 10);
        const [hh,mm] = startInput.value.split(':').map(Number);
        if(!isNaN(hh) && !isNaN(mm)) endInput.value = minutesToLabel((hh*60+mm+mins) % 1440);
      }
    });
    endInput.addEventListener('input', ()=>{
      durChips.forEach(x=>x.classList.remove('active'));
    });

    const cancelBtn = sheetContent.querySelector('#f-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', closeSheet);
    const deleteBtn = sheetContent.querySelector('#f-delete');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      state.events = state.events.filter(e=>e.id!==id);
      saveEvents(); renderTimeline(); closeSheet();
    });
    sheetContent.querySelector('#f-save').addEventListener('click', ()=>{
      const title = sheetContent.querySelector('#f-title').value.trim() || '無題の予定';
      const startVal = startInput.value || '09:00';
      const endVal = endInput.value || startVal;
      const [hh,mm] = startVal.split(':').map(Number);
      const [hh2,mm2] = endVal.split(':').map(Number);
      const start = hh*60+mm;
      let dur = (hh2*60+mm2) - start;
      if(dur <= 0) dur += 1440;
      if(dur < 5) dur = 30;
      if(mode==='edit'){
        const ev = state.events.find(e=>e.id===id);
        Object.assign(ev, {title, start, duration:dur, category:selectedCat});
      } else {
        state.events.push({id: Date.now()+''+Math.floor(Math.random()*999), title, start, duration:dur, category:selectedCat});
      }
      saveEvents(); renderTimeline(); closeSheet();
    });
  }

  function openManualAddSheet(){
    const now = new Date();
    const roundedMin = Math.round(now.getMinutes()/5)*5 % 60;
    const defaultTime = String(now.getHours()).padStart(2,'0')+':'+String(roundedMin).padStart(2,'0');
    openSheet(buildFormHtml({title:'', time: defaultTime, duration:30, category:'private', mode:'add'}));
    wireForm({mode:'add'});
  }
  document.getElementById('manualAddBtn').addEventListener('click', openManualAddSheet);

  function openEditSheet(id){
    const ev = state.events.find(e=>e.id===id);
    if(!ev) return;
    state.editingId = id;
    openSheet(buildFormHtml({title:ev.title, time:minutesToLabel(ev.start), duration:ev.duration, category:ev.category, mode:'edit'}));
    wireForm({mode:'edit', id});
  }

  function openConfirmSheet(parsed, heardText){
    openSheet(buildFormHtml({title:parsed.title, time:parsed.time, duration:30, category:parsed.category, heardText, mode:'add'}));
    wireForm({mode:'add'});
  }

  /* ---------- Voice parsing ---------- */
  function parseJapaneseSpeech(text){
    let remaining = text;
    let hour = null, minute = 0;

    const kanjiTime = remaining.match(/(午前|午後)?\s*(\d{1,2})\s*時\s*(?:(\d{1,2})\s*分)?/);
    const colonTime = remaining.match(/(\d{1,2}):(\d{2})/);

    if(kanjiTime){
      hour = parseInt(kanjiTime[2], 10);
      minute = kanjiTime[3] ? parseInt(kanjiTime[3],10) : 0;
      if(kanjiTime[1] === '午後' && hour < 12) hour += 12;
      if(kanjiTime[1] === '午前' && hour === 12) hour = 0;
      remaining = remaining.replace(kanjiTime[0], '');
    } else if(colonTime){
      hour = parseInt(colonTime[1],10);
      minute = parseInt(colonTime[2],10);
      remaining = remaining.replace(colonTime[0], '');
    }

    remaining = remaining.replace(/^\s*に\s*/, '').replace(/\s*に\s*$/, '').trim();
    remaining = remaining.replace(/^、|^,/, '').trim();

    let category = 'private';
    if(/会議|打ち合わせ|ミーティング|仕事|商談|営業|資料|提出/.test(text)) category = 'work';
    else if(/勉強|授業|講義|宿題|テスト|試験|資格|学習|セミナー|研修|行政書士|過去問|六法|条文|民法|判例|問題集/.test(text)) category = 'study';
    else if(/友達|家族|買い物|映画|デート|ランチ|食事|飲み会|病院|通院|診察|検診|歯医者|薬/.test(text)) category = 'private';

    const now = new Date();
    const timeStr = hour !== null
      ? String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')
      : String(now.getHours()).padStart(2,'0')+':'+String(Math.round(now.getMinutes()/5)*5%60).padStart(2,'0');

    return {
      title: remaining || text,
      time: timeStr,
      category,
      timeWasFound: hour !== null
    };
  }

  /* ---------- Speech recognition ---------- */
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognizer = null;

  if(!SpeechRecognition){
    unsupportedNote.style.display = 'block';
    unsupportedNote.textContent = 'このブラウザは音声入力に対応していません。＋ボタンから手入力で追加できます。';
    micBtn.classList.add('disabled');
  } else {
    recognizer = new SpeechRecognition();
    recognizer.lang = 'ja-JP';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    recognizer.onstart = ()=>{
      recognizing = true;
      micBtn.classList.add('listening');
      listeningHint.style.display = 'block';
    };
    recognizer.onend = ()=>{
      recognizing = false;
      micBtn.classList.remove('listening');
      listeningHint.style.display = 'none';
    };
    recognizer.onerror = ()=>{
      recognizing = false;
      micBtn.classList.remove('listening');
      listeningHint.style.display = 'none';
    };
    recognizer.onresult = (event)=>{
      const text = event.results[0][0].transcript;
      const parsed = parseJapaneseSpeech(text);
      openConfirmSheet(parsed, text);
    };

    micBtn.addEventListener('click', ()=>{
      if(recognizing){
        recognizer.stop();
      } else {
        try{ recognizer.start(); }catch(e){}
      }
    });
  }

  /* ---------- init ---------- */
  renderDateLabel();
  renderExamCountdown();
  loadStudyLog();
  switchToMonthView();
  setInterval(()=>{ if(isToday(state.date)) renderTimeline(); renderExamCountdown(); }, 60000);
})();
</script>

      console.warn('Service Worker registration failed:', err);
    });
  });
