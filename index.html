<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0F2;
    --paper-deep:#E4E7EA;
    --ink:#1C2530;
    --ink-soft:#5B6472;
    --ink-faint:#96A0AB;
    --accent:#8C3540;
    --accent-soft:rgba(140,53,64,0.10);
    --accent-line:rgba(140,53,64,0.35);
    --mustard:#C79433;
    --sage:#5F8767;
    --slate-blue:#4C6B8A;
    --card-bg:#FFFFFF;
    --border:#D8DCE0;
    --shadow: 0 1px 2px rgba(28,37,48,0.06), 0 8px 24px rgba(28,37,48,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      linear-gradient(var(--paper-deep) 1px, transparent 1px);
    background-size: 100% 60px;
    background-position: 0 92px;
  }

  /* ---- Header ---- */
  header{
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:1px solid var(--border);
  }
  .date-row{
    padding:22px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .date-nav{display:flex;align-items:center;gap:10px;}
  .date-nav button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
    background:var(--card-bg);color:var(--ink-soft);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .date-nav button:hover{background:var(--paper-deep);}
  .date-label{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:500;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  .date-label .year{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
    margin-right:1px;
  }
  .date-label .weekday{
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-left:6px;
    font-weight:500;
  }
  .today-btn{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--accent);
    background:var(--accent-soft);
    border:none;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    font-weight:600;
  }
  .date-row-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .cal-toggle-btn{
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--card-bg);
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-toggle-btn.active{
    background:var(--accent);
    border-color:var(--accent);
  }
  #examCountdown{
    background:var(--accent);
    color:#fff;
    padding:8px 20px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.2px;
    display:none;
    align-items:baseline;
    gap:6px;
  }
  #examCountdown .num{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
  }
  #studyLogBar{
    padding:10px 20px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper-deep);
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
  }
  #studyLogBar strong{
    color:var(--ink);
    font-family:'Fraunces',serif;
    font-size:14.5px;
    font-weight:600;
  }
  #studyLogBar .chev{color:var(--ink-faint);font-size:13px;}
  .studylog-grid{
    display:grid;
    grid-template-columns:1fr 60px;
    row-gap:12px;
    column-gap:12px;
    align-items:center;
    max-height:52vh;
    overflow-y:auto;
    padding-right:2px;
  }
  .sl-row{display:contents;}
  .sl-row label{font-size:13.5px;color:var(--ink);}
  .sl-input{
    width:60px;
    padding:8px 6px;
    text-align:center;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-family:'IBM Plex Mono',monospace;
    background:var(--paper);
    color:var(--ink);
  }
  .sl-input:focus{outline:2px solid var(--accent-line);outline-offset:1px;}
  .dur-choices{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .dur-choice{
    padding:8px 12px;
    border-radius:999px;
    border:1.5px solid var(--border);
    background:var(--paper);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .dur-choice.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }
  .sl-section-label{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 8px;
  }

  /* ---- To Do ---- */
  #todoSection{
    margin:16px 20px 4px;
    background:var(--card-bg);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:14px 16px 12px;
  }
  .todo-title{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    margin-bottom:8px;
  }
  .todo-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid var(--border);
  }
  .todo-item:last-child{border-bottom:none;}
  .todo-checkbox{
    width:19px;height:19px;
    border-radius:6px;
    border:1.5px solid var(--border);
    flex-shrink:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    color:#fff;
  }
  .todo-checkbox.checked{
    background:var(--accent);
    border-color:var(--accent);
  }
  .todo-text{
    flex:1;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    word-break:break-word;
  }
  .todo-text.done{
    color:var(--ink-faint);
    text-decoration:line-through;
  }
  .todo-delete{
    color:var(--ink-faint);
    font-size:17px;
    line-height:1;
    cursor:pointer;
    padding:2px 4px;
    flex-shrink:0;
  }
  .todo-empty{
    font-size:12.5px;
    color:var(--ink-faint);
    padding:4px 0 8px;
  }
  .todo-add-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .todo-add-row input{
    flex:1;
    min-width:0;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .todo-add-row input:focus{outline:2px solid var(--accent-line);outline-offset:1px;}
  .todo-add-row button{
    padding:8px 16px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ---- Timeline ---- */
  #timeline-wrap{
    flex:1;
    overflow-y:auto;
    position:relative;
    padding-bottom:140px;
  }
  #timeline{
    position:relative;
    padding-left:96px;
    padding-right:18px;
  }

  /* ---- Month view ---- */
  #monthView{
    flex:1;
    overflow-y:auto;
    padding-bottom:140px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:16px 20px 4px;
  }
  .month-nav button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
    background:var(--card-bg);color:var(--ink-soft);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .month-label{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    min-width:110px;
    text-align:center;
  }
  .month-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    padding:14px 16px 0;
  }
  .month-weekdays div{
    text-align:center;
    font-size:11px;
    font-weight:600;
    color:var(--ink-faint);
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
    padding:6px 16px 20px;
  }
  .month-cell{
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border-radius:10px;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .month-cell.blank{cursor:default;}
  .month-cell.today{
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:700;
  }
  .month-cell.selected{
    outline:2px solid var(--accent);
    outline-offset:-2px;
  }
  .month-cell .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--accent);
  }
  .hour-row{
    height:80px;
    position:relative;
    border-top:1px solid var(--border);
  }
  .hour-row:first-child{border-top:none;}
  .hour-label{
    position:absolute;
    left:-82px;
    top:-8px;
    width:72px;
    text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
  }
  .now-line{
    position:absolute;
    left:0;
    right:0;
    height:0;
    border-top:2px solid var(--accent);
    z-index:5;
    pointer-events:none;
  }
  .now-line::before{
    content:'';
    position:absolute;
    left:90px;
    top:-4.5px;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--accent);
  }
  .now-label{
    position:absolute;
    left:14px;
    top:-8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:500;
    color:var(--accent);
    background:var(--paper);
    padding:0 2px;
  }
  .event-card{
    position:absolute;
    left:96px;
    right:18px;
    min-height:44px;
    background:var(--card-bg);
    border-left:3px solid var(--slate-blue);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:6px 10px;
    cursor:pointer;
    z-index:3;
    overflow:hidden;
    transition:box-shadow .15s;
  }
  .event-card:active{box-shadow:0 1px 2px rgba(28,37,48,0.1);}
  .event-card.cat-work{border-left-color:var(--mustard); background:rgba(199,148,51,0.12);}
  .event-card.cat-study{border-left-color:var(--sage); background:rgba(95,135,103,0.12);}
  .event-card.cat-private{border-left-color:var(--slate-blue); background:rgba(76,107,138,0.12);}
  .event-title{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
  }
  .event-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }

  .empty-state{
    position:absolute;
    top:340px;
    left:96px;right:18px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.7;
    padding:0 10px;
  }
  .empty-state strong{display:block;font-family:'Fraunces',serif;font-size:17px;color:var(--ink);font-weight:500;margin-bottom:6px;}

  /* ---- Bottom controls ---- */
  #controls{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:520px;
    margin:0 auto;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:14px;
    padding:0 20px 26px;
    z-index:30;
    pointer-events:none;
  }
  #controls > *{pointer-events:auto;}
  .add-btn{
    width:48px;height:48px;border-radius:50%;
    background:var(--card-bg);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    color:var(--ink-soft);
    font-size:20px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .mic-btn{
    width:66px;height:66px;border-radius:50%;
    background:var(--accent);
    border:none;
    box-shadow:0 4px 16px rgba(140,53,64,0.35);
    color:#fff;
    font-size:26px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  .mic-btn:active{transform:scale(0.94);}
  .mic-btn.listening{
    animation:pulse 1.4s infinite;
  }
  .mic-btn.disabled{
    background:var(--ink-faint);
    box-shadow:none;
    cursor:not-allowed;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(140,53,64,0.45);}
    70%{box-shadow:0 0 0 16px rgba(140,53,64,0);}
    100%{box-shadow:0 0 0 0 rgba(140,53,64,0);}
  }
  .listening-hint{
    position:fixed;
    left:0;right:0;
    bottom:106px;
    max-width:480px;
    margin:0 auto;
    text-align:center;
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
    z-index:30;
  }

  /* ---- Sheet (confirm / edit / manual add) ---- */
  #overlay{
    position:fixed;inset:0;
    background:rgba(28,37,48,0.32);
    z-index:40;
    opacity:0;pointer-events:none;
    transition:opacity .18s;
  }
  #overlay.open{opacity:1;pointer-events:auto;}
  #sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:520px;
    margin:0 auto;
    background:var(--card-bg);
    border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(28,37,48,0.18);
    padding:20px 20px 26px;
    z-index:41;
    transform:translateY(100%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);
  }
  #sheet.open{transform:translateY(0);}
  .sheet-title{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:500;
    margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input[type=text], .field input[type=time]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
  }
  .field input:focus{outline:2px solid var(--accent-line);outline-offset:1px;}
  .time-range{display:flex;align-items:center;gap:8px;}
  .time-range input[type=time]{flex:1;min-width:0;}
  .time-sep{color:var(--ink-soft);font-size:13px;flex-shrink:0;}
  .cat-choices{display:flex;gap:8px;}
  .cat-choice{
    flex:1;
    padding:9px 4px;
    border-radius:8px;
    border:1.5px solid var(--border);
    background:var(--paper);
    text-align:center;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-choice.active{
    border-color:currentColor;
    background:var(--card-bg);
  }
  .cat-choice[data-cat=work].active{color:var(--mustard);}
  .cat-choice[data-cat=study].active{color:var(--sage);}
  .cat-choice[data-cat=private].active{color:var(--slate-blue);}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{
    flex:1;
    padding:12px;
    border-radius:9px;
    border:none;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--paper);color:var(--ink-soft);}
  .btn-danger{background:#F4E4E1;color:var(--accent);}
  .heard-text{
    background:var(--accent-soft);
    color:var(--accent);
    font-size:13px;
    padding:9px 12px;
    border-radius:8px;
    margin-bottom:14px;
    line-height:1.5;
  }
  .unsupported-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-faint);
    padding:6px 30px 0;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="date-row">
      <div class="date-nav">
        <button id="prevDay" aria-label="前の日">‹</button>
        <div class="date-label" id="dateLabel"></div>
        <button id="nextDay" aria-label="次の日">›</button>
      </div>
      <div class="date-row-right">
        <button class="today-btn" id="todayBtn">今日</button>
        <button class="cal-toggle-btn" id="calToggleBtn" aria-label="カレンダー表示">📅</button>
      </div>
    </div>
    <div id="examCountdown"></div>
    <div id="studyLogBar"></div>
  </header>

  <div id="timeline-wrap">
    <div id="todoSection">
      <div class="todo-title">To Do</div>
      <div id="todoList"></div>
      <div class="todo-add-row">
        <input type="text" id="todoInput" placeholder="やることを追加">
        <button id="todoAddBtn">追加</button>
      </div>
    </div>
    <div id="timeline"></div>
  </div>

  <div id="monthView" style="display:none;">
    <div class="month-nav">
      <button id="prevMonth" aria-label="前の月">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth" aria-label="次の月">›</button>
    </div>
    <div class="month-weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div class="listening-hint" id="listeningHint" style="display:none;">🎙 聞いています…話しかけてください</div>
  <div id="controls">
    <button class="add-btn" id="manualAddBtn" aria-label="手入力で追加">＋</button>
    <button class="mic-btn" id="micBtn" aria-label="音声で予定を追加">🎤</button>
  </div>
  <div class="unsupported-note" id="unsupportedNote" style="display:none;position:fixed;bottom:100px;left:0;right:0;max-width:480px;margin:0 auto;"></div>
</div>

<div id="overlay"></div>
<div id="sheet">
  <div id="sheetContent"></div>
</div>

<script>
(function(){
  const state = {
    date: new Date(),
    events: [],
    editingId: null,
    studyLog: {},
    todos: [],
    viewMode: 'month',
    monthCursor: new Date()
  };

  const HOUR_PX = 80; // 1時間あたりの高さ(px)。CSSの.hour-rowと合わせる
  const PX_PER_MIN = HOUR_PX / 60;
  const MIN_CARD_PX = 44; // 短い予定でもタイトルと時刻が両方収まる最低の高さ

  const dow = ['日','月','火','水','木','金','土'];
  function fmtDateKey(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function isToday(d){ return fmtDateKey(d) === fmtDateKey(new Date()); }
  function storageKey(d){ return 'schedule:'+fmtDateKey(d); }

  const dateLabel = document.getElementById('dateLabel');
  const timeline = document.getElementById('timeline');
  const timelineWrap = document.getElementById('timeline-wrap');
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const sheetContent = document.getElementById('sheetContent');
  const micBtn = document.getElementById('micBtn');
  const listeningHint = document.getElementById('listeningHint');
  const unsupportedNote = document.getElementById('unsupportedNote');
  const examCountdownEl = document.getElementById('examCountdown');
  const studyLogBarEl = document.getElementById('studyLogBar');
  const calToggleBtn = document.getElementById('calToggleBtn');
  const dateNavEl = document.querySelector('.date-nav');
  const monthViewEl = document.getElementById('monthView');
  const monthGridEl = document.getElementById('monthGrid');
  const monthLabelEl = document.getElementById('monthLabel');
  const controlsEl = document.getElementById('controls');

  const STUDY_SUBJECTS = [
    ['minpou','民法'],
    ['gyousei','行政法'],
    ['kenpou','憲法'],
    ['shouhou','商法'],
    ['kisohougaku','基礎法学'],
    ['kisochishiki','基礎知識'],
    ['kijutsu_minpou','記述式（民法）'],
    ['kijutsu_gyousei','記述式（行政法）'],
    ['kijutsu_kakomon_minpou','記述式（過去問　民法）'],
    ['kijutsu_kakomon_gyousei','記述式（過去問　行政法）'],
    ['agaroot','アガルート']
  ];

  const STUDY_DURATIONS = [
    [30,'30分'], [60,'1時間'], [90,'1時間30分'],
    [120,'2時間'], [150,'2時間30分'], [180,'3時間以上']
  ];

  function formatStudyDuration(mins){
    if(!mins) return '';
    const h = Math.floor(mins/60), m = mins%60;
    if(h===0) return m+'分';
    if(m===0) return h+'時間';
    return h+'時間'+m+'分';
  }

  function studyLogKey(d){ return 'studylog:'+fmtDateKey(d); }

  async function loadStudyLog(){
    try{
      const res = await window.storage.get(studyLogKey(state.date), false);
      state.studyLog = res && res.value ? JSON.parse(res.value) : {};
    }catch(e){
      state.studyLog = {};
    }
    renderStudyLogBar();
  }

  async function saveStudyLogData(data){
    state.studyLog = data;
    try{
      await window.storage.set(studyLogKey(state.date), JSON.stringify(data), false);
    }catch(e){ /* 保存できなくても操作は継続 */ }
    renderStudyLogBar();
  }

  function studyLogTotal(log){
    return STUDY_SUBJECTS.reduce((sum,[key])=> sum + (parseInt(log[key],10) || 0), 0);
  }

  function renderStudyLogBar(){
    const log = state.studyLog || {};
    const total = studyLogTotal(log);
    const durText = formatStudyDuration(log.duration);
    const parts = [];
    if(total > 0) parts.push('<strong>'+total+'</strong>問');
    if(durText) parts.push('<strong>'+durText+'</strong>');
    if(log.mogiRound) parts.push('模試 第<strong>'+log.mogiRound+'</strong>回');
    const text = parts.length > 0 ? '📝 今日の学習: '+parts.join('・') : '📝 今日解いた問題数を記録';
    studyLogBarEl.innerHTML = text + ' <span class="chev">›</span>';
  }

  function openStudyLogSheet(){
    const log = state.studyLog || {};
    let selectedDuration = log.duration || null;
    const durChips = STUDY_DURATIONS.map(([mins,label])=>
      '<div class="dur-choice'+(mins===selectedDuration ? ' active' : '')+'" data-mins="'+mins+'">'+label+'</div>'
    ).join('');
    const rows = STUDY_SUBJECTS.map(([key,label])=>
      '<div class="sl-row"><label>'+label+'</label><input type="text" inputmode="numeric" class="sl-input" data-key="'+key+'" value="'+(log[key] || '')+'"></div>'
    ).join('');
    openSheet(
      '<div class="sheet-title">今日解いた問題数</div>' +
      '<p class="sl-section-label">勉強時間</p>' +
      '<div class="dur-choices">'+durChips+'</div>' +
      '<p class="sl-section-label" style="margin-top:18px;">模試</p>' +
      '<div class="field"><label>模試 第◯回</label>' +
        '<input type="text" inputmode="numeric" id="sl-mogi-round" placeholder="回数を入力" value="'+(log.mogiRound || '')+'" style="max-width:120px;"></div>' +
      '<p class="sl-section-label" style="margin-top:18px;">科目別の問題数</p>' +
      '<div class="studylog-grid">'+rows+'</div>' +
      '<div class="sheet-actions" style="margin-top:18px;">' +
        '<button class="btn btn-ghost" id="sl-cancel">閉じる</button>' +
        '<button class="btn btn-primary" id="sl-save">保存</button>' +
      '</div>'
    );
    sheetContent.querySelectorAll('.dur-choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        const mins = parseInt(el.dataset.mins, 10);
        if(selectedDuration === mins){
          selectedDuration = null;
        } else {
          selectedDuration = mins;
        }
        sheetContent.querySelectorAll('.dur-choice').forEach(x=>x.classList.remove('active'));
        if(selectedDuration !== null) el.classList.add('active');
      });
    });
    sheetContent.querySelector('#sl-cancel').addEventListener('click', closeSheet);
    sheetContent.querySelector('#sl-save').addEventListener('click', ()=>{
      const data = {};
      sheetContent.querySelectorAll('.sl-input').forEach(inp=>{
        const v = parseInt(inp.value, 10);
        if(!isNaN(v) && v > 0) data[inp.dataset.key] = v;
      });
      if(selectedDuration) data.duration = selectedDuration;
      const mogiVal = parseInt(sheetContent.querySelector('#sl-mogi-round').value, 10);
      if(!isNaN(mogiVal) && mogiVal > 0) data.mogiRound = mogiVal;
      saveStudyLogData(data);
      closeSheet();
    });
  }
  studyLogBarEl.addEventListener('click', openStudyLogSheet);

  const EXAM_DATE = new Date(2026, 10, 8); // 行政書士試験: 2026年11月8日

  function renderExamCountdown(){
    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diffDays = Math.round((EXAM_DATE - todayMid) / 86400000);
    if(diffDays > 0){
      examCountdownEl.innerHTML = '行政書士試験まであと <span class="num">'+diffDays+'</span> 日';
      examCountdownEl.style.display = 'flex';
    } else if(diffDays === 0){
      examCountdownEl.innerHTML = '本日、行政書士試験です';
      examCountdownEl.style.display = 'flex';
    } else {
      examCountdownEl.style.display = 'none';
    }
  }

  function renderDateLabel(){
    const d = state.date;
    dateLabel.innerHTML = '<span class="year">'+d.getFullYear()+'年</span>'+(d.getMonth()+1)+'月'+d.getDate()+'日<span class="weekday">'+dow[d.getDay()]+'曜日</span>';
  }

  async function loadEvents(){
    try{
      const res = await window.storage.get(storageKey(state.date), false);
      state.events = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      state.events = [];
    }
    renderTimeline();
  }

  async function saveEvents(){
    try{
      await window.storage.set(storageKey(state.date), JSON.stringify(state.events), false);
    }catch(e){ /* 保存できなくても操作は継続 */ }
  }

  function minutesToLabel(m){
    const h = Math.floor(m/60), mi = m%60;
    return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
  }

  function renderTimeline(){
    timeline.innerHTML = '';
    for(let h=0; h<24; h++){
      const row = document.createElement('div');
      row.className = 'hour-row';
      const label = document.createElement('div');
      label.className = 'hour-label';
      label.textContent = String(h).padStart(2,'0')+':00';
      row.appendChild(label);
      timeline.appendChild(row);
    }

    if(isToday(state.date)){
      const now = new Date();
      const mins = now.getHours()*60 + now.getMinutes();
      const line = document.createElement('div');
      line.className = 'now-line';
      line.style.top = (mins * PX_PER_MIN) + 'px';
      const nowLabel = document.createElement('div');
      nowLabel.className = 'now-label';
      nowLabel.textContent = minutesToLabel(mins);
      line.appendChild(nowLabel);
      timeline.appendChild(line);
    }

    if(state.events.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<strong>予定はまだありません</strong>マイクボタンを押して話しかけるか、＋で手入力してみましょう。';
      timeline.appendChild(empty);
    }

    state.events.slice().sort((a,b)=>a.start-b.start).forEach(ev=>{
      const card = document.createElement('div');
      card.className = 'event-card cat-'+ev.category;
      card.style.top = (ev.start * PX_PER_MIN) + 'px';
      card.style.height = Math.max(ev.duration * PX_PER_MIN, MIN_CARD_PX) + 'px';
      card.innerHTML = '<div class="event-title">'+escapeHtml(ev.title)+'</div>'+
        '<div class="event-time">'+minutesToLabel(ev.start)+' – '+minutesToLabel(ev.start+ev.duration)+'</div>';
      card.addEventListener('click', ()=> openEditSheet(ev.id));
      timeline.appendChild(card);
    });

    timeline.style.height = (24 * HOUR_PX) + 'px';
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- To Do ---------- */
  const todoListEl = document.getElementById('todoList');
  const todoInputEl = document.getElementById('todoInput');

  function todoKey(d){ return 'todos:'+fmtDateKey(d); }

  async function loadTodos(){
    try{
      const res = await window.storage.get(todoKey(state.date), false);
      state.todos = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      state.todos = [];
    }
    renderTodos();
  }

  async function saveTodos(){
    try{
      await window.storage.set(todoKey(state.date), JSON.stringify(state.todos), false);
    }catch(e){ /* 保存できなくても操作は継続 */ }
  }

  function renderTodos(){
    if(state.todos.length === 0){
      todoListEl.innerHTML = '<div class="todo-empty">やることはまだありません</div>';
      return;
    }
    todoListEl.innerHTML = state.todos.map(t=>
      '<div class="todo-item" data-id="'+t.id+'">' +
        '<div class="todo-checkbox'+(t.done ? ' checked' : '')+'" data-action="toggle">'+(t.done ? '✓' : '')+'</div>' +
        '<div class="todo-text'+(t.done ? ' done' : '')+'" data-action="toggle">'+escapeHtml(t.text)+'</div>' +
        '<div class="todo-delete" data-action="delete">×</div>' +
      '</div>'
    ).join('');
    todoListEl.querySelectorAll('[data-action="toggle"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.closest('.todo-item').dataset.id;
        const t = state.todos.find(x=>x.id===id);
        if(t){ t.done = !t.done; saveTodos(); renderTodos(); }
      });
    });
    todoListEl.querySelectorAll('[data-action="delete"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.closest('.todo-item').dataset.id;
        state.todos = state.todos.filter(x=>x.id!==id);
        saveTodos(); renderTodos();
      });
    });
  }

  function addTodo(){
    const text = todoInputEl.value.trim();
    if(!text) return;
    state.todos.push({id: Date.now()+''+Math.floor(Math.random()*999), text, done:false});
    todoInputEl.value = '';
    saveTodos(); renderTodos();
  }
  document.getElementById('todoAddBtn').addEventListener('click', addTodo);
  todoInputEl.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') addTodo();
  });

  function scrollToNow(){
    if(isToday(state.date)){
      const now = new Date();
      const mins = now.getHours()*60 + now.getMinutes();
      timelineWrap.scrollTop = Math.max(0, mins * PX_PER_MIN - 160);
    } else {
      timelineWrap.scrollTop = 8*HOUR_PX - 40;
    }
  }

  document.getElementById('prevDay').addEventListener('click', ()=>{
    state.date.setDate(state.date.getDate()-1);
    renderDateLabel(); loadEvents(); loadStudyLog(); loadTodos(); scrollToNow();
  });
  document.getElementById('nextDay').addEventListener('click', ()=>{
    state.date.setDate(state.date.getDate()+1);
    renderDateLabel(); loadEvents(); loadStudyLog(); loadTodos(); scrollToNow();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    state.date = new Date();
    renderDateLabel(); loadStudyLog();
    if(state.viewMode === 'month'){
      state.monthCursor = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
      renderMonthGrid();
    } else {
      loadEvents(); loadTodos(); scrollToNow();
    }
  });

  /* ---------- Month view ---------- */
  function monthPrefix(year, month){
    return 'schedule:'+year+'-'+String(month+1).padStart(2,'0');
  }

  async function daysWithEventsInMonth(year, month){
    const daySet = new Set();
    try{
      const res = await window.storage.list(monthPrefix(year, month), false);
      const keys = (res && res.keys) || [];
      keys.forEach(k=>{
        const m = k.match(/schedule:\d{4}-\d{2}-(\d{2})$/);
        if(m) daySet.add(parseInt(m[1], 10));
      });
    }catch(e){ /* 一覧取得に失敗しても表示は継続 */ }
    return daySet;
  }

  async function renderMonthGrid(){
    const year = state.monthCursor.getFullYear();
    const month = state.monthCursor.getMonth();
    monthLabelEl.textContent = year+'年'+(month+1)+'月';

    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const eventDays = await daysWithEventsInMonth(year, month);

    const todayKey = fmtDateKey(new Date());
    const selectedKey = fmtDateKey(state.date);

    let html = '';
    for(let i=0; i<firstDow; i++){
      html += '<div class="month-cell blank"></div>';
    }
    for(let day=1; day<=daysInMonth; day++){
      const cellDate = new Date(year, month, day);
      const key = fmtDateKey(cellDate);
      const classes = ['month-cell'];
      if(key === todayKey) classes.push('today');
      if(key === selectedKey) classes.push('selected');
      html += '<div class="'+classes.join(' ')+'" data-day="'+day+'">'+day+
        (eventDays.has(day) ? '<span class="dot"></span>' : '') + '</div>';
    }
    monthGridEl.innerHTML = html;

    monthGridEl.querySelectorAll('.month-cell:not(.blank)').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        const day = parseInt(cell.dataset.day, 10);
        state.date = new Date(year, month, day);
        switchToDayView();
      });
    });
  }

  function switchToDayView(){
    state.viewMode = 'day';
    monthViewEl.style.display = 'none';
    timelineWrap.style.display = '';
    controlsEl.style.display = 'flex';
    calToggleBtn.classList.remove('active');
    dateNavEl.style.display = '';
    renderDateLabel(); loadEvents(); loadStudyLog(); loadTodos(); scrollToNow();
  }

  function switchToMonthView(){
    state.viewMode = 'month';
    state.monthCursor = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
    timelineWrap.style.display = 'none';
    controlsEl.style.display = 'none';
    monthViewEl.style.display = 'block';
    calToggleBtn.classList.add('active');
    dateNavEl.style.display = 'none';
    renderMonthGrid();
  }

  calToggleBtn.addEventListener('click', ()=>{
    if(state.viewMode === 'month'){
      switchToDayView();
    } else {
      switchToMonthView();
    }
  });

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    state.monthCursor.setMonth(state.monthCursor.getMonth()-1);
    renderMonthGrid();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    state.monthCursor.setMonth(state.monthCursor.getMonth()+1);
    renderMonthGrid();
  });

  /* ---------- Sheet (bottom form) ---------- */
  function openSheet(html){
    sheetContent.innerHTML = html;
    overlay.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheet(){
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    state.editingId = null;
  }
  overlay.addEventListener('click', closeSheet);

  function categoryChoicesHtml(selected){
    const cats = [['work','仕事'],['study','勉強'],['private','プライベート']];
    return '<div class="cat-choices">' + cats.map(c=>
      '<div class="cat-choice'+(c[0]===selected?' active':'')+'" data-cat="'+c[0]+'">'+c[1]+'</div>'
    ).join('') + '</div>';
  }

  const EVENT_DURATIONS = [15, 30, 45, 60, 90, 120];

  function quickDurationChipsHtml(selected){
    const chips = EVENT_DURATIONS.map(m=>
      '<div class="dur-choice'+(m===selected ? ' active' : '')+'" data-mins="'+m+'">'+formatStudyDuration(m)+'</div>'
    ).join('');
    return '<div class="dur-choices" id="f-duration-choices">'+chips+'</div>';
  }

  function buildFormHtml({title, time, duration, category, heardText, mode}){
    const dur = duration || 30;
    const [sh, sm] = time.split(':').map(Number);
    const endLabel = minutesToLabel((sh*60 + sm + dur) % 1440);
    return (heardText ? '<div class="heard-text">🎙 「'+escapeHtml(heardText)+'」</div>' : '') +
      '<div class="sheet-title">'+(mode==='edit' ? '予定を編集' : '予定を追加')+'</div>' +
      '<div class="field"><label>タイトル</label><input type="text" id="f-title" value="'+escapeHtml(title||'')+'" placeholder="例: 打ち合わせ"></div>' +
      '<div class="field"><label>時刻</label><div class="time-range">' +
        '<input type="time" id="f-time" value="'+time+'">' +
        '<span class="time-sep">〜</span>' +
        '<input type="time" id="f-end-time" value="'+endLabel+'">' +
      '</div></div>' +
      '<div class="field"><label>長さの目安</label>'+quickDurationChipsHtml(dur)+'</div>' +
      '<div class="field"><label>カテゴリー</label>'+categoryChoicesHtml(category||'private')+'</div>' +
      '<div class="sheet-actions">' +
        (mode==='edit' ? '<button class="btn btn-danger" id="f-delete">削除</button>' : '<button class="btn btn-ghost" id="f-cancel">キャンセル</button>') +
        '<button class="btn btn-primary" id="f-save">'+(mode==='edit' ? '保存' : '追加')+'</button>' +
      '</div>';
  }

  function wireForm({mode, id}){
    let selectedCat = sheetContent.querySelector('.cat-choice.active')?.dataset.cat || 'private';
    sheetContent.querySelectorAll('.cat-choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        sheetContent.querySelectorAll('.cat-choice').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        selectedCat = el.dataset.cat;
      });
    });

    const startInput = sheetContent.querySelector('#f-time');
    const endInput = sheetContent.querySelector('#f-end-time');
    const durChips = sheetContent.querySelectorAll('#f-duration-choices .dur-choice');

    durChips.forEach(el=>{
      el.addEventListener('click', ()=>{
        durChips.forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        const mins = parseInt(el.dataset.mins, 10);
        const [hh,mm] = startInput.value.split(':').map(Number);
        endInput.value = minutesToLabel((hh*60+mm+mins) % 1440);
      });
    });
    startInput.addEventListener('input', ()=>{
      const activeChip = sheetContent.querySelector('#f-duration-choices .dur-choice.active');
      if(activeChip){
        const mins = parseInt(activeChip.dataset.mins, 10);
        const [hh,mm] = startInput.value.split(':').map(Number);
        if(!isNaN(hh) && !isNaN(mm)) endInput.value = minutesToLabel((hh*60+mm+mins) % 1440);
      }
    });
    endInput.addEventListener('input', ()=>{
      durChips.forEach(x=>x.classList.remove('active'));
    });

    const cancelBtn = sheetContent.querySelector('#f-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', closeSheet);
    const deleteBtn = sheetContent.querySelector('#f-delete');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      state.events = state.events.filter(e=>e.id!==id);
      saveEvents(); renderTimeline(); closeSheet();
    });
    sheetContent.querySelector('#f-save').addEventListener('click', ()=>{
      const title = sheetContent.querySelector('#f-title').value.trim() || '無題の予定';
      const startVal = startInput.value || '09:00';
      const endVal = endInput.value || startVal;
      const [hh,mm] = startVal.split(':').map(Number);
      const [hh2,mm2] = endVal.split(':').map(Number);
      const start = hh*60+mm;
      let dur = (hh2*60+mm2) - start;
      if(dur <= 0) dur += 1440;
      if(dur < 5) dur = 30;
      if(mode==='edit'){
        const ev = state.events.find(e=>e.id===id);
        Object.assign(ev, {title, start, duration:dur, category:selectedCat});
      } else {
        state.events.push({id: Date.now()+''+Math.floor(Math.random()*999), title, start, duration:dur, category:selectedCat});
      }
      saveEvents(); renderTimeline(); closeSheet();
    });
  }

  function openManualAddSheet(){
    const now = new Date();
    const roundedMin = Math.round(now.getMinutes()/5)*5 % 60;
    const defaultTime = String(now.getHours()).padStart(2,'0')+':'+String(roundedMin).padStart(2,'0');
    openSheet(buildFormHtml({title:'', time: defaultTime, duration:30, category:'private', mode:'add'}));
    wireForm({mode:'add'});
  }
  document.getElementById('manualAddBtn').addEventListener('click', openManualAddSheet);

  function openEditSheet(id){
    const ev = state.events.find(e=>e.id===id);
    if(!ev) return;
    state.editingId = id;
    openSheet(buildFormHtml({title:ev.title, time:minutesToLabel(ev.start), duration:ev.duration, category:ev.category, mode:'edit'}));
    wireForm({mode:'edit', id});
  }

  function openConfirmSheet(parsed, heardText){
    openSheet(buildFormHtml({title:parsed.title, time:parsed.time, duration:30, category:parsed.category, heardText, mode:'add'}));
    wireForm({mode:'add'});
  }

  /* ---------- Voice parsing ---------- */
  function parseJapaneseSpeech(text){
    let remaining = text;
    let hour = null, minute = 0;

    const kanjiTime = remaining.match(/(午前|午後)?\s*(\d{1,2})\s*時\s*(?:(\d{1,2})\s*分)?/);
    const colonTime = remaining.match(/(\d{1,2}):(\d{2})/);

    if(kanjiTime){
      hour = parseInt(kanjiTime[2], 10);
      minute = kanjiTime[3] ? parseInt(kanjiTime[3],10) : 0;
      if(kanjiTime[1] === '午後' && hour < 12) hour += 12;
      if(kanjiTime[1] === '午前' && hour === 12) hour = 0;
      remaining = remaining.replace(kanjiTime[0], '');
    } else if(colonTime){
      hour = parseInt(colonTime[1],10);
      minute = parseInt(colonTime[2],10);
      remaining = remaining.replace(colonTime[0], '');
    }

    remaining = remaining.replace(/^\s*に\s*/, '').replace(/\s*に\s*$/, '').trim();
    remaining = remaining.replace(/^、|^,/, '').trim();

    let category = 'private';
    if(/会議|打ち合わせ|ミーティング|仕事|商談|営業|資料|提出/.test(text)) category = 'work';
    else if(/勉強|授業|講義|宿題|テスト|試験|資格|学習|セミナー|研修|行政書士|過去問|六法|条文|民法|判例|問題集/.test(text)) category = 'study';
    else if(/友達|家族|買い物|映画|デート|ランチ|食事|飲み会|病院|通院|診察|検診|歯医者|薬/.test(text)) category = 'private';

    const now = new Date();
    const timeStr = hour !== null
      ? String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')
      : String(now.getHours()).padStart(2,'0')+':'+String(Math.round(now.getMinutes()/5)*5%60).padStart(2,'0');

    return {
      title: remaining || text,
      time: timeStr,
      category,
      timeWasFound: hour !== null
    };
  }

  /* ---------- Speech recognition ---------- */
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognizer = null;

  if(!SpeechRecognition){
    unsupportedNote.style.display = 'block';
    unsupportedNote.textContent = 'このブラウザは音声入力に対応していません。＋ボタンから手入力で追加できます。';
    micBtn.classList.add('disabled');
  } else {
    recognizer = new SpeechRecognition();
    recognizer.lang = 'ja-JP';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    recognizer.onstart = ()=>{
      recognizing = true;
      micBtn.classList.add('listening');
      listeningHint.style.display = 'block';
    };
    recognizer.onend = ()=>{
      recognizing = false;
      micBtn.classList.remove('listening');
      listeningHint.style.display = 'none';
    };
    recognizer.onerror = ()=>{
      recognizing = false;
      micBtn.classList.remove('listening');
      listeningHint.style.display = 'none';
    };
    recognizer.onresult = (event)=>{
      const text = event.results[0][0].transcript;
      const parsed = parseJapaneseSpeech(text);
      openConfirmSheet(parsed, text);
    };

    micBtn.addEventListener('click', ()=>{
      if(recognizing){
        recognizer.stop();
      } else {
        try{ recognizer.start(); }catch(e){}
      }
    });
  }

  /* ---------- init ---------- */
  renderDateLabel();
  renderExamCountdown();
  loadStudyLog();
  switchToMonthView();
  setInterval(()=>{ if(isToday(state.date)) renderTimeline(); renderExamCountdown(); }, 60000);
})();
</script>
</body>
</html>
